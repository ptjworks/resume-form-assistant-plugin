[package]
name = "resume-pro-desktop"
version = "0.5.0"
description = "网申快填 unique-writer host with application manager"
authors = ["网申快填"]
edition = "2021"
# 与开发文档和双平台 CI 实际验证的工具链下限一致。
rust-version = "1.94"
publish = false

[features]
usage-metrics-acceptance = []

[lib]
name = "resume_pro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ai-extract = { path = "../crates/ai-extract" }
archive-store = { path = "../crates/archive-store" }
backup = { path = "../crates/backup" }
backup-crypt = { path = "../crates/backup-crypt" }
webdav-client = { path = "../crates/webdav-client" }
fs2 = "0.4"
tempfile = "3"
data-service = { path = "../crates/data-service" }
evidence-import = { path = "../crates/evidence-import" }
mailbox-sync = { path = "../crates/mailbox-sync" }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
# 保留已验证的 reqwest 范围；XLSX 安全修复不顺带更新网络依赖。
reqwest = { version = ">=0.13.0, <0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
# reqwest 的 connector_layer 要用这两个 trait（#299 记连接是否完成）；版本跟 reqwest 已经依赖的一致。
tower-layer = "0.3"
tower-service = "0.3"
local-ipc = { path = "../crates/local-ipc" }
nm-frame = { path = "../crates/nm-frame" }
regex = "1"
reminders = { path = "../crates/reminders" }
resume-sheet = { path = "../crates/resume-sheet" }
resume-pro-protocol = { path = "../crates/protocol" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
sha2 = "0.10.9"
url = "2.5.8"

[dev-dependencies]
rusqlite = "0.40"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
winreg = "0.56.0"
