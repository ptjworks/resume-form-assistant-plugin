name: Metrics Acceptance Packages
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'extension/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/metrics-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: metrics-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.94.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: desktop
      - name: Test acceptance directory isolation
        run: cargo test --features usage-metrics-acceptance metrics_acceptance::tests
        working-directory: desktop/src-tauri
      # Ordinary CI tests remain unable to send statistics; only this explicitly
      # isolated release feature can target the fixed TEST endpoint after disclosure.
      - run: npm run tauri build -- --no-bundle --features usage-metrics-acceptance --config src-tauri/tauri.metrics-test.json --target ${{ matrix.target }}
        working-directory: desktop
        env:
          RESUME_USAGE_METRICS_ACCEPTANCE_BUILD: '1'
      - name: Stage isolated package
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'macos-arm64' ]; then
            mkdir -p 'output/acceptance-app/Contents/MacOS'
            cp desktop/src-tauri/target/${{ matrix.target }}/release/resume-pro-desktop output/acceptance-app/Contents/MacOS/
            cp desktop/src-tauri/metrics-test-Info.plist output/acceptance-app/Contents/Info.plist
            mv output/acceptance-app 'output/Resume Metrics Test.app'
            codesign --force --deep --sign - 'output/Resume Metrics Test.app'
            node desktop/scripts/package-metrics-test.mjs macos-arm64 'output/Resume Metrics Test.app' output/metrics-acceptance
          else
            node desktop/scripts/package-metrics-test.mjs windows-x64 desktop/src-tauri/target/${{ matrix.target }}/release/resume-pro-desktop.exe output/metrics-acceptance
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usage-metrics-test-${{ matrix.platform }}
          path: output/usage-metrics-test-${{ matrix.platform }}.zip
          retention-days: 7
