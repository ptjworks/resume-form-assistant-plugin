name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  usage-metrics-worker:
    name: usage-metrics-worker
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: services/usage-metrics
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/usage-metrics/package-lock.json
      - name: Install worker tooling
        run: npm ci
      - name: Test Worker and D1 locally
        run: npm test
      - name: Verify local migrations and maintainer report
        run: |
          npm run migrate:local
          node scripts/report.mjs --local > report.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('report.json','utf8'));if(r.counts.dau!==0||r.downloads!==null)process.exit(1)"
      - name: Verify deploy bundle without uploading
        run: npx wrangler deploy --dry-run --outdir output/dry-run
      - name: Record tested Worker provenance
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "$SOURCE_COMMIT"
          printf '%s\n' "$SOURCE_COMMIT" > output/source-commit.txt
          git rev-parse HEAD > output/checkout-commit.txt
          # npm test builds and runs Workerd against output/worker.mjs.
          # Keep checksum paths relative to the downloaded artifact root.
          (cd output && sha256sum worker.mjs > worker.sha256 && sha256sum -c worker.sha256)
      - name: Save tested Worker for controlled deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: usage-metrics-worker-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            services/usage-metrics/output/worker.mjs
            services/usage-metrics/output/worker.sha256
            services/usage-metrics/output/source-commit.txt
            services/usage-metrics/output/checkout-commit.txt
          if-no-files-found: error
          retention-days: 14
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dev dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check extension/control-adapters.js
          node --check extension/antd-prefix.js
          node --check extension/custom-controls.js
          node --check extension/ai-helpers.js
          node --check extension/form-agent.js
          node --check extension/fill-probe.js
          node --check extension/field-scan.js
          node --check extension/page-outline.js
          node --check extension/deep-analysis.js
          node --check extension/page-actions.js
          node --check extension/page-recipe.js
          node --check extension/feedback-core.js
          node --check extension/feedback-ui.js
          node --check extension/link/feedback.mjs
          node --check extension/background.js
          node --check extension/ai-worker.js
          node --check extension/ai-host.js
          node --check extension/ai-client.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/resume-utils.js
          node --check extension/profile-fields.js

      - name: Verify manifest
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: Type check
        run: |
          # types/ 里那个探针自己证明不了自己在项目里：一旦从 tsconfig 的 include 掉出去，
          # tsc 不检查它也照样退出 0。先断言项目确实包含它和生成的类型，再信这次通过。
          npx tsc --noEmit --listFiles > tsc-files.txt
          grep -q 'types/protocol-contract.check.mjs' tsc-files.txt || { echo 'types/protocol-contract.check.mjs is not in the tsc project'; exit 1; }
          grep -q 'desktop/crates/protocol/js/protocol.d.ts' tsc-files.txt || { echo 'protocol.d.ts is not in the tsc project'; exit 1; }
          rm tsc-files.txt
          npx tsc --noEmit

      - name: Run tests
        run: node --test tests/*.test.js
