name: Release Desktop

# 桌面自己的 tag 命名空间。插件走 release.yml 的 `v*.*.*`，两边不能撞：
# 一次桌面发版不该顺手把插件也发出去。
#
# `workflow_dispatch` 是给发版前试跑用的：同样构建、同样校验，只是不建 Release。
# 「打 tag 那天才发现构建坏了」是这条管道最贵的失败方式。
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-15
            rust-target: aarch64-apple-darwin
            bundles: dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 要看一个提交在不在 main 的历史里，浅克隆看不出来。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.rust-target }}

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci

      # tag、tauri.conf.json、Cargo.toml 三处版本号对不上就别往下走：
      # 构建出来的文件名会和 tag 不一致，用户下载后无从判断装的是哪一版。
      # tag 名走 env 传：`run:` 里插值等于把 ref 名当 shell 代码执行。
      - name: Verify tag and bundle config
        id: release-metadata
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          node desktop/scripts/check-desktop-release.js "$TAG"
          metrics_ready=0
          metrics_endpoint=
          if [ "$(node desktop/scripts/check-desktop-release.js --metrics-ready "$REPOSITORY" "$TAG" "$RELEASE_EVENT")" = "1" ]; then
            metrics_ready=1
            metrics_endpoint=https://metrics.19991107.xyz/v1/activity
          fi
          echo "metrics_ready=$metrics_ready" >> "$GITHUB_OUTPUT"
          echo "metrics_endpoint=$metrics_endpoint" >> "$GITHUB_OUTPUT"

      # 测试版的提交在临时分支上，不在 main 的历史里；正式 tag 若指到那种提交，
      # 就等于把没走过 main 的代码当正式版发出去。
      - name: Stable tags must come from main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          kind=$(node desktop/scripts/check-desktop-release.js --release-kind "$TAG")
          echo "release kind: $kind"
          if [ "$kind" = "stable" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "正式版 tag $TAG 指向的提交不在 main 上" >&2; exit 1; }
          fi

      # Cargo.lock 过期时这一步会失败，而不是让构建悄悄改锁文件：
      # 「可复现构建」的前提是锁文件说了算。
      - name: Check Cargo.lock is current
        working-directory: desktop/src-tauri
        run: cargo fetch --locked

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      # 配置里没夹带文件，不代表 dist 里没有 sourcemap 或测试夹具。
      - name: Check frontend output
        run: node desktop/scripts/check-desktop-release.js --dist desktop/dist

      - name: Build installer
        id: installer
        working-directory: desktop
        env:
          RESUME_USAGE_METRICS_READY: ${{ steps.release-metadata.outputs.metrics_ready }}
          RESUME_USAGE_METRICS_RELEASE_BUILD: ${{ steps.release-metadata.outputs.metrics_ready }}
          RESUME_USAGE_METRICS_ENDPOINT: ${{ steps.release-metadata.outputs.metrics_endpoint }}
        run: npm run tauri build -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}

      - name: Diagnostic install and launch Windows candidate (not acceptance)
        if: matrix.name == 'windows-x64'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem `
            "desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis" `
            -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          # GitHub-hosted Windows runners use an administrator token with UAC disabled.
          # This catches packaging/startup regressions but is explicitly ineligible as the
          # standard-user D13/T4 acceptance evidence.
          ./desktop/scripts/d13_install_acceptance.ps1 `
            -CheckExplicitQuit `
            -Installer $installer.FullName `
            -AllowElevatedDiagnostic

      - name: Collect artifacts and checksums
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          found=0
          while IFS= read -r -d '' file; do
            # Tauri 用中文 productName 命名，GitHub 上传时会删掉中文；这里换成 ASCII 名。
            name=$(node desktop/scripts/check-desktop-release.js --installer-name "$(basename "$file")")
            cp "$file" "dist-release/$name"
            found=$((found + 1))
          done < <(find "desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle" \
            -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "构建没产出安装包" >&2
            exit 1
          fi
          # 校验和由脚本用 Node 算：macOS runner 上不一定有 sha256sum。
          # 同一条命令顺手把「目录里只有安装包和配套校验和」验掉。
          node desktop/scripts/check-desktop-release.js --assets dist-release --write-checksums

      - name: Upload artifacts
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-release
          merge-multiple: true

      # 复算一遍校验和：构建机写的和这里手上的是两份文件，中间过了一次 artifact。
      - name: Check what is about to be published
        shell: bash
        run: node desktop/scripts/check-desktop-release.js --assets dist-release

      # 桌面设置页可以跳到本页下载插件 zip，供商店不可用或手动安装时使用。
      # 插件与桌面独立发版，zip 文件名必须用 manifest 版本，不能借用桌面版本。
      # 矩阵作业各出各的安装包，zip 只在这里打一次。
      - name: Pack plugin zip
        shell: bash
        run: |
          set -euo pipefail
          plugin_version=$(node -p 'require("./extension/manifest.json").version')
          node desktop/scripts/pack-plugin.js --output "dist-release/wangshen-kuaitian-plugin-${plugin_version}.zip"
          node desktop/scripts/check-desktop-release.js --assets dist-release --write-checksums --require-plugin-zip

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          kind=$(node desktop/scripts/check-desktop-release.js --release-kind "$TAG")
          {
            if [ "$kind" = "beta" ]; then
              echo "## 这是测试版（beta）"
              echo
              echo "测试版用来提前试用新功能，**可能有严重问题**。它和正式版共用同一份数据和同一个安装位置：装上就是覆盖升级。测试版可能会升级数据库结构，升级之后**无法回到正式版**——正式版会拒绝打开被更新过的数据库，只能从升级前自动做的备份里恢复。没有把握的话请用正式版。"
              echo
            fi
            echo "## macOS 使用 ad-hoc 签名"
            echo
            echo "我们还没有 Apple Developer ID 证书。macOS 安装包使用 ad-hoc 签名来保证 App 包结构完整，但 Gatekeeper 无法据此验证发布者身份，所以："
            echo
            echo "- **Windows**：SmartScreen 会弹蓝色拦截页，要点「更多信息 → 仍要运行」。"
            echo "- **macOS**（仅 Apple Silicon）：右键点 DMG 选「打开」；把 App 拖进「应用程序」之后，**第一次启动还要再右键点 App 选一次「打开」**。较新的 macOS 会把这个入口放在「系统设置 → 隐私与安全性」里的「仍要打开」。"
            echo
            echo "这不是绕过系统保护的窍门，而是没有 Developer ID 时的正常表现。请不要去执行 \`xattr\` 之类降低整机安全性的命令；介意的话请等有 Developer ID 签名的版本。"
            echo
            echo "## 浏览器扩展"
            echo
            echo "浏览器扩展优先从 Chrome 商店安装。若商店不可用或需要手动安装，这个 Release 里也有一份 \`wangshen-kuaitian-plugin-*.zip\`：解压后，在 Chrome 或 Edge 的扩展页打开「开发者模式」，用「加载已解压的扩展程序」选中解压出来的文件夹。ZIP 文件名是插件版本，可能与桌面版本不同。桌面设置页的「连接浏览器」可以跳到商店页，也可以打开本页下载插件包。"
            echo
            echo "## 核对下载到的文件"
            echo
            echo "每个安装包和插件 zip 旁边都有一份 \`.sha256\`。Windows PowerShell：\`Get-FileHash 文件名\`；macOS：\`shasum -a 256 文件名\`。"
            echo
            echo '```'
            cat dist-release/*.sha256
            echo '```'
            echo
            echo "校验和与安装包放在同一个 Release 里，**只能说明文件没在下载途中损坏或被替换，不能证明发布者身份**——那需要 Apple Developer ID 签名，我们还没有。"
            echo
            echo "## 数据放在哪"
            echo
            echo "Windows \`%LOCALAPPDATA%\\ResumePro\`，macOS \`~/Library/Application Support/ResumePro\`。卸载默认不动它。"
          } > release-notes.md
          # 自动生成的变更记录拼在自定义说明后面。`--notes-file` 和 `--generate-notes`
          # 不能一起用：要么命令失败，要么自动内容把签名说明盖掉。
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >> release-notes.md
          cat release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      # 用 runner 自带的 gh，不再引入一个拿着 contents: write 的第三方 action。
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # 测试版建成预发布：GitHub 的「最新版」和桌面自己的更新检查都会跳过预发布，
          # 所以它不会被推给正式版用户。
          kind=$(node desktop/scripts/check-desktop-release.js --release-kind "$TAG")
          flags=()
          if [ "$kind" = "beta" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            ${flags[@]+"${flags[@]}"}
