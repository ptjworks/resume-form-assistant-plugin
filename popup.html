<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件状态 · 网申快填</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="feedback.css">
    <link rel="stylesheet" href="usage-ui.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icons/icon48.png" width="32" height="32" alt="">
        <span class="brand-name">网申快填</span>
        <span class="brand-version">v<span id="plugin-version-top"></span></span>
        <p class="status-pill" id="desktop-pill" data-tone="idle">正在连接桌面…</p>
      </div>
    </header>

    <main class="status-page">
      <div class="hero">
        <span class="hero-mark"><img src="icons/icon128.png" width="64" height="64" alt=""><span id="hero-dot" class="hero-dot" data-tone="idle" aria-hidden="true"></span></span>
        <h1>网申快填 <span class="hero-tag">浏览器插件</span></h1>
        <p class="muted">简历一键快填与投递管理 · 插件 <span id="plugin-version"></span></p>
      </div>

      <section class="card" aria-labelledby="desktop-title">
        <div class="card-head card-head--split">
          <span class="card-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
          <div class="card-heading">
            <h2 id="desktop-title">桌面程序连接状态 <span id="desktop-chip" class="chip" data-tone="idle">正在检测</span></h2>
            <p id="desktop-text" class="card-sub" role="status">正在连接桌面…</p>
          </div>
          <div class="actions actions--head">
            <button type="button" id="desktop-action" class="primary" hidden></button>
            <button type="button" id="desktop-open" class="primary with-icon" hidden>打开桌面</button>
            <button type="button" id="desktop-recheck">重新检测</button>
          </div>
        </div>
        <p class="info-box">简历模板、「我的信息」和 AI 配置都在桌面程序里管理，插件只负责在网页上填写和记录投递。</p>
        <p id="desktop-result" class="result" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="card" id="send-values" aria-labelledby="send-values-title">
        <div class="card-head card-head--split">
          <span class="card-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M4 12 20 4l-4 16-4-6-8-2Z"/><path d="m12 14 8-10"/></svg></span>
          <div class="card-heading">
            <h2 id="send-values-title">AI 填写时发送资料原文</h2>
            <p class="card-sub">默认关闭</p>
          </div>
          <label class="feedback-switch"><input type="checkbox" id="send-values-toggle" disabled>发送资料原文</label>
        </div>
        <p class="info-box">关闭时，AI 只收到网页上的题目和你资料的字段名，资料内容留在本机，由插件按 AI 选的字段填进去。打开后，一键填写时会把资料原文一起发给你在桌面配置的模型服务商，更容易填上；像密码、验证码的字段照旧不发。</p>
        <p id="send-values-result" class="result" role="status" aria-live="polite" hidden></p>
      </section>
      <section class="card" id="migration" aria-labelledby="migration-title" hidden>
        <div class="card-head card-head--split">
          <span class="card-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M4 12h12"/><path d="m12 6 6 6-6 6"/><path d="M20 4v16"/></svg></span>
          <div class="card-heading">
            <h2 id="migration-title" tabindex="-1">旧数据迁移</h2>
            <p class="card-sub">0.4.0 留在插件里的模板、「我的信息」和 AI 配置</p>
          </div>
        </div>
        <p id="migration-text" role="status"></p>
        <ul id="migration-notes" class="notes"></ul>
        <div class="actions" id="migration-actions"></div>
        <p id="migration-result" class="result" role="status" aria-live="polite" hidden></p>
      </section>

      <div id="usage-settings-root"></div>
      <div id="feedback-auto-root"></div>
    </main>

    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <form method="dialog" class="confirm-form">
        <h2 id="confirm-title"></h2>
        <div id="confirm-body" class="confirm-body"></div>
        <div class="confirm-actions">
          <button type="submit" value="cancel" id="confirm-cancel" autofocus>取消</button>
          <button type="submit" value="confirm" id="confirm-ok" class="danger-solid"></button>
        </div>
      </form>
    </dialog>
    <script src="usage-signals.js"></script>
    <script src="feedback-core.js"></script>
    <script src="feedback-ui.js"></script>
    <script src="usage-ui.js"></script>
    <script src="resume-data.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
